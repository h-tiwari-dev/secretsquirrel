<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="secretsquirrel: agents use your secrets without seeing them">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1917"/><stop offset="1" stop-color="#292524"/>
    </linearGradient>
  </defs>
  <rect width="900" height="260" rx="20" fill="url(#bg)"/>
  <text x="70" y="140" font-size="96" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">🐿️</text>
  <text x="200" y="118" font-size="54" font-weight="700" fill="#fafaf9" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">secretsquirrel</text>
  <text x="202" y="158" font-size="22" fill="#d6d3d1" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">Your agent asks. You approve. The nut never leaves the tree.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
    <rect x="202" y="184" width="150" height="34" rx="17" fill="#44403c"/><text x="277" y="206" text-anchor="middle" fill="#fcd34d">GITHUB_TOKEN</text>
    <text x="372" y="207" fill="#a8a29e" font-size="22">→</text>
    <rect x="408" y="184" width="130" height="34" rx="17" fill="#44403c"/><text x="473" y="206" text-anchor="middle" fill="#86efac">you approve</text>
    <text x="558" y="207" fill="#a8a29e" font-size="22">→</text>
    <rect x="594" y="184" width="170" height="34" rx="17" fill="#44403c"/><text x="679" y="206" text-anchor="middle" fill="#93c5fd">injected, scrubbed</text>
  </g>
</svg>
